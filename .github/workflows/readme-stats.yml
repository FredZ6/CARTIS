name: Update GBA README stats
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-gba-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read counters and render GBA screens
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_readme_stats.py
      - name: Save updated displays
        run: |
          git add docs/images/stats
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh GBA statistics'
          git pull --rebase origin main
          git push origin HEAD:main
